<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nyanyanya - Web Edition</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090909;font-family:Arial,Helvetica,sans-serif}#gameContainer{position:fixed;inset:0;width:100%;height:100%;background:#090909}#unity-canvas{width:100%;height:100%;display:block;background:#000}#loadingScreen{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,#242424 0%,#111 45%,#050505 100%);color:white;transition:opacity .5s ease}.loadingBox{width:min(560px,88vw);text-align:center}.title{margin:0 0 8px;font-size:clamp(30px,6vw,54px);font-weight:800;letter-spacing:2px;text-transform:uppercase;text-shadow:0 4px 18px rgba(0,0,0,.7)}.subtitle{margin:0 0 30px;color:#aaa;font-size:15px}.spinner{width:48px;height:48px;margin:0 auto 25px;border:5px solid rgba(255,255,255,.15);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.progressOuter{width:100%;height:10px;overflow:hidden;border-radius:10px;background:rgba(255,255,255,.12);box-shadow:inset 0 0 8px rgba(0,0,0,.5)}#progressBar{width:0%;height:100%;border-radius:inherit;background:#fff;transition:width .15s ease}#progressText{margin-top:12px;font-size:14px;color:#ccc}#error{display:none;margin-top:20px;padding:12px 15px;border-radius:8px;background:rgba(160,0,0,.25);border:1px solid rgba(255,80,80,.4);color:#ffb0b0;font-size:13px;line-height:1.5;word-break:break-word}#fullscreenButton{position:fixed;right:14px;bottom:14px;z-index:20;display:none;padding:9px 13px;border:0;border-radius:7px;background:rgba(0,0,0,.65);color:white;cursor:pointer;font-size:13px}
</style>
</head>
<body>
<div id="gameContainer"><canvas id="unity-canvas" tabindex="-1"></canvas><div id="loadingScreen"><div class="loadingBox"><div class="spinner"></div><h1 class="title">Nyanyanya</h1><p class="subtitle">Loading Web Edition...</p><div class="progressOuter"><div id="progressBar"></div></div><div id="progressText">0%</div><div id="error"></div></div></div></div>
<button id="fullscreenButton">Fullscreen</button>
<script>
const buildUrl="./Build";
const config={dataUrl:buildUrl+"/nyanya.data",frameworkUrl:buildUrl+"/nyanya.framework.js",codeUrl:buildUrl+"/nyanya.wasm",streamingAssetsUrl:"StreamingAssets",companyName:"DefaultCompany",productName:"Nyanyanya",productVersion:"1.0"};
const canvas=document.querySelector("#unity-canvas"),loadingScreen=document.querySelector("#loadingScreen"),progressBar=document.querySelector("#progressBar"),progressText=document.querySelector("#progressText"),errorBox=document.querySelector("#error"),fullscreenButton=document.querySelector("#fullscreenButton");
function showError(message){errorBox.style.display="block";errorBox.textContent=message;console.error(message)}
const script=document.createElement("script");script.src="./Build/nyanya.loader.js";
script.onload=()=>{if(typeof createUnityInstance!=="function"){showError("Unity loader loaded, but createUnityInstance() was not found.");return}createUnityInstance(canvas,config,(progress)=>{const percent=Math.round(progress*100);progressBar.style.width=percent+"%";progressText.textContent=percent+"%"}).then((unityInstance)=>{loadingScreen.style.opacity="0";setTimeout(()=>{loadingScreen.style.display="none";fullscreenButton.style.display="block"},500);fullscreenButton.addEventListener("click",()=>unityInstance.SetFullscreen(1))}).catch((message)=>showError("Failed to start Nyanyanya: "+message))};
script.onerror=()=>showError("Could not load Build/nyanya.loader.js. Make sure index.html is in the Nyanyanya folder and the Unity files are inside Nyanyanya/Build.");document.body.appendChild(script);
</script>
</body>
</html>
